[unix_http_server]
file=/tmp/kgrs-supervisor.sock

[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
loglevel=info
pidfile=/tmp/kgrs-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/kgrs-supervisor.sock

; ── Backend ──────────────────────────────────────────────────────────────────
[program:kgrs-backend]
command=/home/wei-chi/miniconda3/envs/AD/bin/python -u -m uvicorn api_server:app --host 0.0.0.0 --port 8080
directory=/home/wei-chi/Alzheimers_Project/external_data/scripts/downstream
autostart=true
autorestart=true
startretries=5
startsecs=30
stopwaitsecs=10
stdout_logfile=logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=logs/backend_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
environment=PATH="/home/wei-chi/miniconda3/envs/AD/bin:%(ENV_PATH)s"

; ── Frontend ─────────────────────────────────────────────────────────────────
[program:kgrs-frontend]
command=/home/wei-chi/.nvm/versions/node/v20.20.2/bin/npm run dev -- --host 0.0.0.0 --port 5173
directory=/home/wei-chi/Alzheimers_Project/external_data/scripts/downstream/kgrs-frontend
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=5
stdout_logfile=logs/frontend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=logs/frontend_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
